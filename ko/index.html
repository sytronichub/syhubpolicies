<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>정책 센터 - Sytronic Hub</title>
    <link rel="Shortcut Icon" href="https://static.sytronichub.com/images/favicon.ico" />
    <link rel="Bookmark" href="https://static.sytronichub.com/images/favicon.ico" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <meta name="description" content="我们注重您的体验，在这里查阅我们的相关政策。Sytronic Hub，让兴趣与众不同。在这里，分享你的视频和日常。">
    <meta name="keywords" content="隐私政策, 用户服务协议, 隐私, 条款, 政策中心, 政策, Sytronic Hub, 视频, ACG, 动画, 游戏, 音乐, 科技">
    <style>
        /* ---------- 与参考页面一致的 CSS 变量 ---------- */
        :root {
            --primary: #43A047;
            --on-primary: #FFFFFF;
            --primary-container: #C8E6C9;
            --on-primary-container: #1B5E20;
            --secondary: #42A5F5;
            --on-secondary: #FFFFFF;
            --secondary-container: #BBDEFB;
            --on-secondary-container: #0D47A1;
            --surface: #F7FAF7;
            --surface-dim: #D8DDD8;
            --surface-cl: #FFFFFF;
            --surface-clo: #F1F6F1;
            --surface-c: #EBF0EB;
            --surface-ch: #E3EAE3;
            --surface-chh: #DDE4DD;
            --on-surface: #191D19;
            --on-sv: #414941;
            --outline: #717971;
            --outline-v: #C1C9C1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Nunito', 'sans-serif';
            background: var(--surface);
            color: var(--on-surface);
            padding-top: 64px; /* 为固定导航栏留出空间 */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 1023px) {
            body {
                padding-top: 56px;
            }
        }

        /* ---------- 导航栏：纯色，与背景融为一体 ---------- */
        .nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            background: var(--surface); /* 与页面背景完全一致 */
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            transition: background-color 0.3s;
        }

        @media (max-width: 1023px) {
            .nav-bar {
                height: 56px;
                padding: 0 16px;
            }
        }

        /* 导航栏内部容器：宽度更宽，最大宽度 1600px */
        .nav-inner {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            align-items: center;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--on-surface);
            font-weight: 900;
            font-size: 18px;
            letter-spacing: -0.3px;
        }

        .nav-brand img {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .nav-brand span {
            font-size: 18px;
            font-weight: 900;
            color: var(--on-surface);
        }

        @media (max-width: 1023px) {
            .nav-brand img {
                width: 28px;
                height: 28px;
            }
            .nav-brand span {
                font-size: 16px;
            }
        }

        /* ---------- 主内容：全部左对齐 ---------- */
        .main-wrap {
            flex: 1;
            display: flex;
            align-items: center;         /* 垂直居中 */
            justify-content: center; /* 内容块水平居中（文字仍左对齐） */
            padding: 40px 24px 60px;
        }

        .main-inner {
            max-width: 720px;
            width: 100%;
            text-align: left;
            margin: 0 auto;
            /* 所有文本左对齐 */
        }

        /* 图标装饰 */
        .icon-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border-radius: 24px;
            background: var(--primary-container);
            color: var(--on-primary-container);
            margin-bottom: 24px;
            margin-left: 0;              /* 确保左对齐 */
        }

        .icon-wrap .material-icons-round {
            font-size: 40px;
        }

        /* 标题 */
        .main-title {
            font-size: 36px;
            font-weight: 900;
            line-height: 1.2;
            color: var(--on-surface);
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        @media (max-width: 639px) {
            .main-title {
                font-size: 28px;
            }
        }

        /* 描述文本 */
        .main-desc {
            font-size: 17px;
            line-height: 1.7;
            color: var(--on-sv);
            max-width: 560px;
            margin: 0 0 36px 0;          /* 移除 auto，强制靠左 */
            font-weight: 500;
        }

        @media (max-width: 639px) {
            .main-desc {
                font-size: 15px;
                line-height: 1.6;
            }
        }

        /* 链接按钮组 */
        .link-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start; /* 按钮靠左排列（只居中内容块） */
            gap: 16px;
        }
        .link-group a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }
        .policy-links {
            flex-direction: column;
            align-items: flex-start;
            gap: 14px;
        }
        .policy-links a {
            display: inline-flex;
            flex-direction: column;
            gap: 2px;
            font-size: 16px;
        }
        .policy-updated {
            font-size: 12px;
            font-weight: 600;
            color: var(--outline);
        }
        .btn-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 36px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            transition: background-color 0.25s, transform 0.15s;
            border: none;
            background: var(--primary);
            color: var(--on-primary);
            cursor: pointer;
            min-width: 180px;
            justify-content: center;
        }

        .btn-link:hover {
            background: #388E3C;
            transform: translateY(-2px);
        }

        .btn-link:active {
            transform: translateY(0);
        }

        .btn-link .material-icons-round {
            font-size: 20px;
        }

        /* 第二个按钮使用不同的颜色 */
        .btn-link.secondary {
            background: var(--secondary);
            color: var(--on-secondary);
        }

        .btn-link.secondary:hover {
            background: #1E88E5;
        }

        /* 辅助联系文本 */
        .contact-hint {
            margin-top: 32px;
            font-size: 13px;
            color: var(--outline);
            font-weight: 600;
            text-align: left;
        }
        .contact-hint a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }
        .contact-hint a:hover {
            text-decoration: underline;
        }
        .contact-hint .material-icons-round {
            font-size: 16px;
            vertical-align: middle;
            margin-right: 4px;
        }

        @media (max-width: 480px) {
            .btn-link {
                padding: 12px 24px;
                font-size: 14px;
                min-width: 140px;
                width: 100%;
                justify-content: center;
            }
            .link-group {
                flex-direction: column;
                align-items: stretch;    /* 移动端按钮撑满宽度，但整体仍靠左 */
                gap: 12px;
            }
        }

        /* ---------- 深色模式 ---------- */
        :root { color-scheme: light dark; }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #66BB6A;
                --on-primary: #08210B;
                --primary-container: #1E3B22;
                --on-primary-container: #C8E6C9;
                --secondary: #64B5F6;
                --on-secondary: #04203A;
                --secondary-container: #12324D;
                --on-secondary-container: #BBDEFB;
                --surface: #0F1210;
                --surface-dim: #0A0C0A;
                --surface-cl: #171B18;
                --surface-clo: #141815;
                --surface-c: #1B201C;
                --surface-ch: #242A25;
                --surface-chh: #2C332D;
                --on-surface: #E6EBE6;
                --on-sv: #A9B3AA;
                --outline: #8B948B;
                --outline-v: #39423A;
            }
            .btn-link:hover { background: #81C784; }
            .btn-link.secondary:hover { background: #42A5F5; }
            .back-link-group a:hover { color: #81C784; }
        }

        /* ---------- 导航右侧链接 ---------- */
        .nav-links {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .nav-links a {
            color: var(--on-sv);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            transition: color .2s;
        }
        .nav-links a:hover { color: var(--primary); }

        /* ---------- 修订历史 ---------- */
        .revision-history {
            margin-top: 36px;
            padding-top: 22px;
            border-top: 2px solid var(--surface-ch);
        }
        .revision-history h2 {
            font-size: 20px;
            font-weight: 800;
            color: var(--on-surface);
            margin-bottom: 6px;
        }
        .revision-intro {
            font-size: 13px;
            color: var(--outline);
            margin-bottom: 14px;
        }
        .revision-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .revision-table th,
        .revision-table td {
            text-align: left;
            padding: 10px 12px;
            border-bottom: 1px solid var(--surface-ch);
            vertical-align: top;
        }
        .revision-table th {
            color: var(--outline);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .04em;
            white-space: nowrap;
        }
        .revision-table td { color: var(--on-sv); line-height: 1.6; }
        .revision-table td:first-child {
            color: var(--on-surface);
            font-weight: 800;
            white-space: nowrap;
        }
        .revision-table tr:last-child td { border-bottom: none; }
        .revision-more { margin-top: 14px; font-size: 13px; }
        .revision-more a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }
        .revision-more a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <!-- ====== 导航栏 ====== -->
    <nav class="nav-bar" role="navigation" aria-label="主导航">
        <div class="nav-inner">
            <a href="/" class="nav-brand" aria-label="Sytronic Hub 首页">
                <img src="https://static.sytronichub.com/images/solar-logo.png" alt="Sytronic Hub Logo" />
                <span>政策中心</span>
            </a>
        </div>
    </nav>

    <!-- ====== 主内容 ====== -->
    <main class="main-wrap">
        <div class="main-inner">
            <!-- 装饰图标 -->
            <div class="icon-wrap" aria-hidden="true">
                <span class="material-icons-round">privacy_tip</span>
            </div>

            <!-- 标题 -->
            <h1 class="main-title">개인정보를 소중히 여깁니다</h1>

            <!-- 描述 -->
            <p class="main-desc">
개인정보는 매우 중요합니다. 아래 정책을 확인해 주세요.
            </p>

            <!-- 引导链接 -->
            <div class="link-group policy-links">
                <a href="/ko/privacy">개인정보 처리방침</a>
                <a href="/ko/terms">서비스 이용약관</a>
                <a href="/ko/community-guideline">커뮤니티 가이드라인</a>
                <a href="/ko/account-deletion">계정 삭제 계약</a>
                <a href="/ko/minor-agreement">미성년자 서비스 계약</a>
            </div>

            <!-- 辅助联系提示 -->
            <p class="contact-hint">
                <span class="material-icons-round">info</span>
                개인정보 관련 문의: help@sytronichub.com
            </p>

        </div>
    </main>

</body>
</html>
